openapi: 3.0.3
info:
  title: Nodo 2 - Sucursal
  version: 1.2.0
  description: API de Sucursal. El servidor consume el Banco Central con
    X-API-KEY. Sin configuración usa datos simulados solo en local; en
    producción devuelve 503. El historial contiene las operaciones procesadas
    por esta sucursal. La ruta /cuentas/{numero}/transacciones devuelve el
    historial completo de una cuenta abierta por esta sucursal, incluidos cajeros.
servers:
  - url: /api
tags:
  - name: Estado
  - name: Cuentas
  - name: Transacciones
paths:
  /estado:
    get:
      tags:
        - Estado
      summary: Verifica la conexión con el Banco Central
      responses:
        "200":
          description: Conectado
          content:
            application/json:
              schema:
                type: object
                properties:
                  conectado:
                    type: boolean
                  modo_prueba:
                    type: boolean
                  nodo:
                    $ref: "#/components/schemas/Nodo"
        "401": &a1
          $ref: "#/components/responses/Error"
        "404": *a1
        "500": *a1
        "502": *a1
        "503": *a1
  /cuentas:
    post:
      tags:
        - Cuentas
      summary: Abre una cuenta nueva en el Banco Central
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CuentaNueva"
            example:
              titular: Juan Pérez
              saldo_inicial: 1000
              idempotency_key: apertura-cliente-001
      responses:
        "200":
          description: Apertura ya confirmada; se recupera la misma cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cuenta"
        "201":
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cuenta"
        "400": *a1
        "401": *a1
        "403": *a1
        "409": *a1
        "422": *a1
        "500": *a1
        "502": *a1
        "503": *a1
      description: Usar la misma clave por intento. Una apertura nueva devuelve 201;
        un reintento devuelve 200 y la misma cuenta con su saldo actual.
        Reutilizar la clave con otros datos devuelve 409. Si se omite, cada
        llamada representa una apertura nueva.
      parameters:
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: ^[a-zA-Z0-9._:-]+$
          description: Alternativa a idempotency_key en el JSON. Si se envían ambas deben
            coincidir.
  /cuentas/{numero}:
    get:
      tags:
        - Cuentas
      summary: Consulta una cuenta por número
      parameters:
        - in: path
          name: numero
          required: true
          schema:
            type: string
          example: "1001"
      responses:
        "200":
          description: Datos de la cuenta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cuenta"
        "401": *a1
        "404": *a1
        "500": *a1
        "502": *a1
        "503": *a1
  /cuentas/{numero}/transacciones:
    get:
      tags:
        - Transacciones
      summary: Historial completo de la cuenta, incluidos movimientos del cajero
      description: Solo cuentas abiertas por esta sucursal. Recorre todas las páginas
        del Banco Central antes de responder y añade el nodo que procesó cada movimiento.
        /transacciones y /reportes conservan su alcance local.
      parameters:
        - in: path
          name: numero
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lista completa de movimientos de la cuenta
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: "#/components/schemas/Transaccion"
                    - type: object
                      properties:
                        nodo:
                          type: object
                          properties:
                            id:
                              type: string
                              format: uuid
                            nombre:
                              type: string
                            tipo:
                              type: string
                              enum: [sucursal, cajero]
        "401": *a1
        "403": *a1
        "404": *a1
        "500": *a1
        "502": *a1
        "503": *a1
  /transacciones:
    get:
      tags:
        - Transacciones
      summary: Historial de transacciones de la sucursal (opcionalmente por cuenta)
      parameters:
        - in: query
          name: cuenta
          schema:
            type: string
      responses:
        "200":
          description: Lista de transacciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Transaccion"
        "400": *a1
        "401": *a1
        "500": *a1
        "501": *a1
        "502": *a1
        "503": *a1
  /reportes:
    get:
      tags:
        - Transacciones
      summary: Reporte local de la sucursal (totales por tipo)
      parameters:
        - in: query
          name: cuenta
          schema:
            type: string
      responses:
        "200":
          description: Resumen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reporte"
        "400": *a1
        "401": *a1
        "500": *a1
        "501": *a1
        "502": *a1
        "503": *a1
  /healthz:
    servers:
      - url: /
    get:
      tags:
        - Estado
      summary: Salud del proceso y versión publicada
      description: No comprueba la conexión al Banco Central; usar /api/estado para
        esa comprobación.
      responses:
        "200":
          description: Proceso activo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                  service:
                    type: string
                    example: sucursal-nodo2
                  commit:
                    type: string
                    nullable: true
                  branch:
                    type: string
                    nullable: true
components:
  schemas:
    Nodo:
      type: object
      properties:
        nombre:
          type: string
        tipo:
          type: string
          example: sucursal
        efectivo_disponible:
          type: number
    CuentaNueva:
      type: object
      required:
        - titular
        - saldo_inicial
      properties:
        titular:
          type: string
          minLength: 1
          maxLength: 255
        saldo_inicial:
          type: number
          minimum: 0
          maximum: 9999999999999.99
          multipleOf: 0.01
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-zA-Z0-9._:-]+$
          description: Conservar durante todo reintento; una operación nueva necesita otra
            clave.
    Cuenta:
      type: object
      properties:
        numero_cuenta:
          type: string
          example: "1001"
        titular:
          type: string
        saldo:
          type: number
          example: 1000
        estado:
          type: string
          enum:
            - activa
            - bloqueada
        reintentada:
          type: boolean
          description: Presente en la respuesta de apertura. true si se recuperó un
            intento ya confirmado.
    Transaccion:
      type: object
      properties:
        cuenta_origen:
          type: string
          nullable: true
        cuenta_destino:
          type: string
          nullable: true
        monto:
          type: number
        tipo:
          type: string
          enum:
            - retiro
            - deposito
            - transferencia
        created_at:
          type: string
          format: date-time
    Reporte:
      type: object
      properties:
        operaciones:
          type: integer
        monto_total:
          type: number
        por_tipo:
          type: object
          additionalProperties:
            type: object
            properties:
              operaciones:
                type: integer
              monto:
                type: number
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
